<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Preview Treinamento - Inda Fire</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: #FFFFFF;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>

    <section class="training-dynamic-section" id="treinamento">
      <div class="container" style="overflow: visible;">
        
        <div class="training-content-grid">
          
          <!-- Left Column: Title, Description & Larger Floating Video Player -->
          <div class="training-meta-col">
            <div class="training-tag-label">TREINAMENTOS</div>
            <h2 class="training-main-title">Brigada de incêndio</h2>
            <p class="training-main-desc">
              Realizamos o treinamento com todo o conteúdo teórico e prático, conforme NBR-14276/06 e decretos estaduais do corpo de bombeiros.
            </p>

            <!-- Video Player um pouco maior (640px) -->
            <div class="training-video-spotlight">
              <div class="training-video-wrapper">
                <video id="trainingVideo" class="training-drill-video" autoplay loop muted playsinline poster="images/original_site/3-2141.jpg">
                  <source src="video/treinamento-brigada.mp4" type="video/mp4">
                  Seu navegador não suporta a tag de vídeo.
                </video>
                
                <!-- Live Video Badge -->
                <div class="training-card-badge">
                  <span class="badge-dot"></span>
                  <span>SIMULAÇÃO REAL • NBR 14276</span>
                </div>

                <!-- Video Controls Overlay (Unmute / Play-Pause) -->
                <div class="training-video-controls">
                  <button type="button" class="btn-video-control" id="btnToggleSound" aria-label="Ativar/Desativar Som" title="Ativar/Desativar Som">
                    <svg class="sound-icon-muted" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
                  </button>
                  <button type="button" class="btn-video-control" id="btnTogglePlay" aria-label="Pausar/Reproduzir Vídeo" title="Pausar/Reproduzir Vídeo">
                    <svg class="play-icon-pause" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                  </button>
                </div>
              </div>
            </div>

            <div class="training-action-wrap">
              <a href="#contato" class="btn-training-schedule" data-subject="Treinamento de Brigada de Incêndio">
                <span>AGENDAR AGORA MESMO</span>
                <span class="btn-arrow">➔</span>
              </a>
            </div>
          </div>

          <!-- Right Column: Official Firefighter Framed in High Definition Showcase Card -->
          <div class="training-firefighter-hero">
            <div class="firefighter-hero-card-official">
              <img src="images/bombeiro-treinamento-oficial.jpg" alt="Bombeiro da Inda Fire em treinamento de brigada com esguicho e proteção completa" class="firefighter-official-img" loading="lazy" />
              <div class="firefighter-card-glow"></div>
            </div>
          </div>

        </div>

      </div>

      <!-- Asymmetrical Dark Foundation Base Block extending to bottom -->
      <div class="training-dark-foundation"></div>
    </section>

</body>
</html>
