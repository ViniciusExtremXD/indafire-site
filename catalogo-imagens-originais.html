      text-transform: uppercase;

      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);

    .media-card:hover {

    let currentCategory = 'all';

    function renderGallery(items) {
      const grid = document.getElementById('galleryGrid');
      grid.innerHTML = items.map(item => `
        <div class="media-card" data-cat="${item.category}" data-title="${item.title.toLowerCase()}">
          <div class="media-thumb-box">
            <span class="media-category-pill">${item.category}</span>
            <img src="${item.localPath}" alt="${item.title}" loading="lazy" onerror="this.src='brand/logo.svg'" />
          </div>
          <div class="media-info">
            <h4 class="media-title" title="${item.title}">${item.title}</h4>
            <div class="media-meta-list">
              <div class="meta-row">
                <span class="meta-label">Arquivo:</span>
                <span class="meta-val">${item.filename}</span>
              </div>
              <div class="meta-row">
                <span class="meta-label">Tamanho:</span>
                <span class="meta-val">${item.sizeKb} KB</span>
              </div>
            </div>
            <div class="media-actions">
              <a href="${item.localPath}" download="${item.filename}" class="btn-download-single">⬇ Baixar</a>
              <a href="${item.localPath}" target="_blank" class="btn-view-single">👁 Abrir</a>
            </div>
          </div>
        </div>
      `).join('');
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.toggle('active', b.getAttribute('data-filter') === cat);
      });
      filterMedia();
    }

    function filterMedia() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = CATALOG_ITEMS.filter(item => {
        const matchesCat = currentCategory === 'all' || item.category === currentCategory;
        const matchesQ = !q || item.title.toLowerCase().includes(q) || item.filename.toLowerCase().includes(q) || item.category.toLowerCase().includes(q);
        return matchesCat && matchesQ;
      });
      renderGallery(filtered);
    }

    function downloadManifestJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(CATALOG_ITEMS, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "indafire-catalogo-original-manifest.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    async function downloadAllInZip() {
      const btn = document.getElementById('btnZipAll');
      const progressBox = document.getElementById('zipProgressBox');
      const progressFill = document.getElementById('zipProgressFill');
      const progressPercent = document.getElementById('zipProgressPercent');
      const progressText = document.getElementById('zipProgressText');

      btn.disabled = true;
      btn.textContent = '⏳ Preparando ZIP...';
      progressBox.classList.add('active');

      try {
        const zip = new JSZip();
        const productsFolder = zip.folder("produtos-homologados-rotulados");
        const mediaFolder = zip.folder("midias-originais-site");

        let processed = 0;
        const total = CATALOG_ITEMS.length;

        for (const item of CATALOG_ITEMS) {
          try {
            const resp = await fetch(item.localPath);
            const blob = await resp.blob();
            if (item.isProduct) {
              productsFolder.file(item.filename, blob);
            } else {
              mediaFolder.file(item.filename, blob);
            }
          } catch (err) {
            console.error('Erro ao adicionar arquivo ao zip:', item.filename, err);
          }
          processed++;
          const pct = Math.round((processed / total) * 100);
          progressFill.style.width = pct + '%';
          progressPercent.textContent = pct + '%';
          progressText.textContent = `Adicionando ao ZIP: ${processed}/${total} imagens...`;
        }

        progressText.textContent = 'Gerando arquivo .ZIP final...';
        const zipContent = await zip.generateAsync({ type: "blob" }, (metadata) => {
          progressFill.style.width = metadata.percent.toFixed(0) + '%';
          progressPercent.textContent = metadata.percent.toFixed(0) + '%';
        });

        saveAs(zipContent, "indafire-catalogo-imagens-originais.zip");
        progressText.textContent = '✅ Download concluído com sucesso!';
      } catch (err) {
        alert('Erro ao gerar arquivo ZIP: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '📦 Baixar Todas em ZIP';
        setTimeout(() => progressBox.classList.remove('active'), 4000);
      }
    }

    // Initial render
    renderGallery(CATALOG_ITEMS);
  </script>
